{% extends "base.html" %}
{% block title %}{{ course.title }}{% endblock %}
{% block content %}
{% include "includes/pagination.html" %}

<h1 class="text-dark">Видалити завдання🚫</h1>
<p class="text-dark">{{ assignment.title }}</p>

<form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn-custom">Так, видалити✅</button>
    <a href="{% url 'lesson_detail' assignment.lesson.id %}" class="link-btn ms-2">Скасувати🚫</a>
</form>

{% endblock %}
