{% extends "base.html" %}
{% block title %}{{ course.title }}{% endblock %}
{% block content %}
{% include "includes/pagination.html" %}

<h1 class="text-dark">Створити урок📖: {{ module.title }}</h1>

<form method="post" class="mt-3" style="max-width: 500px;">
  {% csrf_token %}

  <input type="text" name="title" class="custom-input" placeholder="Назва уроку" required>

  <textarea name="content" class="custom-textarea mt-2" rows="5" placeholder="Зміст" required></textarea>

  <input type="url" name="video_url" class="custom-input mt-2" placeholder="Посилання на відео🎥">

  <button type="submit" class="btn-custom mt-3 w-100">Створити урок📖</button>
</form>

{% endblock %}
