{% extends "base.html" %}
{% block title %}Увійти{% endblock %}
{% block content %}
{% include "includes/pagination.html" %}

<div class="page-container">
  <div class="custom-card">

    <h2 class="mb-4 text-center">Увійти 🔐</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="custom-btn w-100 mt-2">
            Увійти
        </button>
    </form>

    <p class="mt-3 text-center">
        Немає акаунта?
        <a href="{% url 'register' %}" class="custom-link">
            Зареєструватися
        </a>
    </p>

  </div>
</div>

{% endblock %}
