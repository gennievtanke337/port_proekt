{% extends "base.html" %}
{% block title %}{{ course.title }}{% endblock %}
{% block content %}
{% include "includes/pagination.html" %}

<h1 class="text-dark">Керування ролями</h1>

<form method="post">
  {% csrf_token %}
  <table class="table mt-3">
    <tr>
      <th>Користувач</th>
      <th>Роль</th>
      <th>Змінити</th>
    </tr>
    {% for user in users %}
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.profile.role }}</td>
      <td>
        <select name="role_{{ user.id }}" class="custom-input">
          <option value="student" {% if user.profile.role == "student" %}selected{% endif %}>Student</option>
          <option value="teacher" {% if user.profile.role == "teacher" %}selected{% endif %}>Teacher</option>
          {% if request.user.is_superuser %}
          <option value="admin" {% if user.profile.role == "admin" %}selected{% endif %}>Admin</option>
          {% endif %}
        </select>
      </td>
    </tr>
    {% endfor %}
  </table>

  <button type="submit" class="btn-custom">Зберегти зміни✅</button>
</form>

{% endblock %}
